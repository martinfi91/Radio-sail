name: Build APK
on:
  workflow_dispatch:
  push:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Create project
        run: |
          mkdir -p app/src/main/java/com/radio/launcher app/src/main/res/drawable-nodpi
          cp car_top.jpg app/src/main/res/drawable-nodpi/car.jpg
          cat > settings.gradle <<'EOT'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'Launcher'
          include ':app'
          EOT
          cat > build.gradle <<'EOT'
          plugins { id 'com.android.application' version '8.5.0' apply false }
          EOT
          cat > gradle.properties <<'EOT'
          org.gradle.jvmargs=-Xmx2g
          EOT
          cat > app/build.gradle <<'EOT'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.radio.launcher'
            compileSdk 34
            defaultConfig {
              applicationId 'com.radio.launcher'
              minSdk 24
              targetSdk 25
              versionCode 1
              versionName '1.0'
            }
          }
          EOT
          cat > app/src/main/AndroidManifest.xml <<'EOT'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:label="Inicio" android:theme="@android:style/Theme.Material.Light.NoActionBar"> <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTask" android:stateNotNeeded="true"> <intent-filter> <action android:name="android.intent.action.MAIN"/> <category android:name="android.intent.category.HOME"/> <category android:name="android.intent.category.DEFAULT"/> <category android:name="android.intent.category.LAUNCHER"/> </intent-filter> </activity> </application>
          </manifest>
          EOT
          cat > app/src/main/java/com/radio/launcher/MainActivity.java <<'EOT'
          package com.radio.launcher;

          import android.app.Activity;
          import android.content.ComponentName;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.TextClock;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity {
            static final int BG = 0xFFDBE3FC, INK = 0xFF1B2A4A, SUB = 0xFF5B6B8C;
            float d;

            int dp(int v) { return (int) (v * d + 0.5f); }

            LinearLayout.LayoutParams lp(int w, int h, float wt) {
              LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(w, h, wt);
              p.setMargins(dp(7), dp(7), dp(7), dp(7));
              return p;
            }

            void white(View v) {
              GradientDrawable g = new GradientDrawable();
              g.setColor(Color.WHITE);
              g.setCornerRadius(dp(22));
              v.setBackground(g);
            }

            Intent app(String pkg, String cls) {
              Intent i = new Intent();
              i.setComponent(new ComponentName(pkg, cls));
              i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
              return i;
            }

            TextView tile(String label, final Intent i) {
              TextView t = new TextView(this);
              t.setText(label);
              t.setTextSize(24);
              t.setTextColor(INK);
              t.setTypeface(Typeface.DEFAULT_BOLD);
              t.setGravity(Gravity.CENTER);
              white(t);
              t.setOnClickListener(new View.OnClickListener() {
                public void onClick(View v) {
                  try {
                    startActivity(i);
                  } catch (Exception e) {
                    Toast.makeText(MainActivity.this, "No se pudo abrir", Toast.LENGTH_SHORT).show();
                  }
                }
              });
              return t;
            }

            LinearLayout row() {
              LinearLayout r = new LinearLayout(this);
              r.setOrientation(LinearLayout.HORIZONTAL);
              return r;
            }

            @Override
            protected void onCreate(Bundle b) {
              super.onCreate(b);
              d = getResources().getDisplayMetrics().density;
              LinearLayout root = new LinearLayout(this);
              root.setBackgroundColor(BG);
              root.setPadding(dp(13), dp(13), dp(13), dp(13));
              LinearLayout left = new LinearLayout(this);
              left.setOrientation(LinearLayout.VERTICAL);
              root.addView(left, new LinearLayout.LayoutParams(0, -1, 2f));

              LinearLayout clock = new LinearLayout(this);
              clock.setOrientation(LinearLayout.VERTICAL);
              clock.setGravity(Gravity.CENTER);
              white(clock);
              TextClock t = new TextClock(this);
              t.setFormat12Hour("h:mm a");
              t.setFormat24Hour("h:mm a");
              t.setTextSize(54);
              t.setTextColor(INK);
              t.setTypeface(Typeface.DEFAULT_BOLD);
              TextClock dt = new TextClock(this);
              dt.setFormat12Hour("EEEE d 'de' MMMM");
              dt.setFormat24Hour("EEEE d 'de' MMMM");
              dt.setTextSize(22);
              dt.setTextColor(SUB);
              clock.addView(t);
              clock.addView(dt);
              left.addView(clock, lp(-1, 0, 1f));

              LinearLayout r1 = row();
              r1.addView(tile("Radio", app("com.nwd.radio", "com.nwd.radio.home_horizontalActivity")), lp(0, -1, 1f));
              r1.addView(tile("Archivos", app("com.nwd.android.music.ui", "com.nwd.android.music.ui.home_horizontalActivity")), lp(0, -1, 1f));
              LinearLayout r2 = row();
              Intent st = new Intent(Settings.ACTION_SETTINGS);
              st.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
              r2.addView(tile("Configuración", st), lp(0, -1, 1f));
              r2.addView(tile("Teléfono", app("com.nwd.android.phone", "com.nwd.android.phone.home_horizontalActivity")), lp(0, -1, 1f));
              left.addView(r1, new LinearLayout.LayoutParams(-1, 0, 1f));
              left.addView(r2, new LinearLayout.LayoutParams(-1, 0, 1f));

              ImageView car = new ImageView(this);
              car.setImageResource(R.drawable.car);
              car.setScaleType(ImageView.ScaleType.FIT_CENTER);
              root.addView(car, new LinearLayout.LayoutParams(0, -1, 1f));
              setContentView(root);
            }
          }
          EOT
      - name: Build
        run: gradle assembleDebug --no-daemon
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ github.run_number }}" app/build/outputs/apk/debug/app-debug.apk --title "Build ${{ github.run_number }}" --notes "APK del launcher"
